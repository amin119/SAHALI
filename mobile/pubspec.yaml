name: sahali
description: "Sahali - Civic reporting platform for Tunisian citizens"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # State management (MVVM)
  provider: ^6.1.2

  # HTTP client
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Preferences (language, theme)
  shared_preferences: ^2.3.4

  # Local DB for offline queue
  sqflite: ^2.4.3
  path: ^1.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Animation
  flutter_animate: ^4.5.2

  # Squircle (continuous-corner) shapes
  figma_squircle: ^0.6.3

  # Duotone icon set
  phosphor_flutter: ^2.1.0

  # Maps (OpenStreetMap, no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location / GPS
  geolocator: ^13.0.2

  # Camera / Gallery (also used for video capture/selection via pickVideo)
  image_picker: ^1.1.2

  # Voice-note recording (agent resolve flow)
  record: ^6.0.0
  path_provider: ^2.1.6

  # Permissions
  permission_handler: ^11.4.0

  # Local device notifications (status-change alerts)
  flutter_local_notifications: ^18.0.1

  # Animated moving background (onboarding / splash)
  flutter_moving_background: ^0.3.0

  # Image caching
  cached_network_image: ^3.4.1

  # Localization helpers
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # generate: false  (localizations are hand-written in lib/core/l10n/)

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/final_logo.png"
  min_sdk_android: 21
