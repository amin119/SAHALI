name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default — the checkout token can't push or modify anything
# beyond what each job explicitly needs (none of these jobs need write access).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.0
          ruff check app/
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          # PYSEC-2026-1325 is ecdsa's known timing side-channel — the
          # maintainers have no fix planned (it's a pure-Python constant-time
          # limitation). It's a transitive dep of python-jose for ECDSA
          # algorithms this app never uses (JWTs are RS256-only) — accepted,
          # not ignorable by upgrading.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: citizen_alert
          POSTGRES_PASSWORD: password
          POSTGRES_DB: citizen_alert_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DATABASE_URL/REDIS_URL for alembic (runs as its own step, ahead of
      # pytest); TEST_DATABASE_URL/TEST_REDIS_URL for conftest.py, which
      # reads those dedicated names rather than trusting ambient
      # DATABASE_URL/REDIS_URL before flushing Redis between tests.
      DATABASE_URL: postgresql://citizen_alert:password@localhost:5432/citizen_alert_test
      REDIS_URL: redis://localhost:6379/1
      TEST_DATABASE_URL: postgresql://citizen_alert:password@localhost:5432/citizen_alert_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Deliberately not `pip install -e .` — this project's flat layout
        # (app/ and alembic/ both at the top level) trips up setuptools'
        # package auto-discovery for an editable install, and it isn't
        # needed anyway: pytest adds backend/ to sys.path on its own.
        run: pip install -r requirements.txt pytest==8.2.2 pytest-asyncio==0.23.7 pytest-cov==5.0.0
      - name: Generate throwaway JWT keys (test-only, never used outside this job)
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem
      - name: Apply migrations
        # 0008 seeds demo accounts with randomly generated passwords and
        # prints them — harmless for this ephemeral test DB, but real
        # credential-shaped strings have no business sitting in a CI log.
        run: alembic upgrade head > /dev/null
      - name: Run tests
        # `python -m pytest` (not bare `pytest`) — this repo has no package
        # install step, so app/ is only importable when Python itself adds
        # the working directory to sys.path, which `-m` does and a bare
        # console-script invocation doesn't.
        run: python -m pytest -v

  backend-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build backend image (catches Dockerfile/dependency issues before Render does)
        run: docker build -t sahali-backend:ci ./backend

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Dependency vulnerability scan (npm audit)
        run: npx audit-ci --config audit-ci.jsonc

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not "stable" — a newer stable release made IconData a
          # final class, which breaks phosphor_flutter 2.1.0 (no fixed
          # version exists upstream yet). 3.41.9 is the version this repo is
          # actually developed against and known to build cleanly.
          flutter-version: "3.41.9"
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
