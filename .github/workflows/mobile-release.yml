name: Mobile Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend API URL"
        required: false
        default: "https://sahali-1.onrender.com/v1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: "3.41.9"

      # Keystore and passwords come from repo secrets — never committed,
      # never pass through a chat transcript. See docs/mobile-release-setup.md
      # for how to set them up.
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - run: flutter pub get

      - name: Build release APK + AAB
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://sahali-1.onrender.com/v1' }}
        run: |
          flutter build apk --release --dart-define=BACKEND_URL=$BACKEND_URL
          flutter build appbundle --release --dart-define=BACKEND_URL=$BACKEND_URL

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload build (manual runs — not tagged, no Release to attach to)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sahali-release-build
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
