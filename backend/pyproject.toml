[project]
name = "citizen-alert-backend"
version = "1.0.0"
description = "Citizen Alert — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "geoalchemy2==0.15.0",
    "shapely>=2.0.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.3.0",
    "email-validator==2.3.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.2",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "redis==5.0.6",
    "celery==5.4.0",
    "boto3==1.34.131",
    "Pillow==12.3.0",
    "sendgrid==6.11.0",
    "firebase-admin==6.5.0",
    "slowapi==0.1.9",
    "bleach==6.4.0",
    "python-dotenv==1.2.2",
    "structlog==24.2.0",
    "sentry-sdk[fastapi]==2.66.0",
    "twilio==9.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx==0.28.1",
    "pytest-cov==5.0.0",
    "ruff==0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately not selecting B (flake8-bugbear), BLE (blind-except), or S
# (flake8-bandit): B008 flags Depends(...)/Query(...) in argument defaults,
# which is the required FastAPI dependency-injection pattern, not a bug; BLE001/
# S110 flag the broad `except Exception` this codebase uses intentionally
# around third-party SDK calls (SendGrid, Twilio, Firebase, S3, geocoding) so a
# flaky external service degrades a feature instead of failing the request.
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
